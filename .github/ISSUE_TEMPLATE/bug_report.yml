name: Bug Report
description: Report something that is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click "Save" on the kitchen station form, nothing happens and no error is shown.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps to reproduce the behavior.
      placeholder: |
        1. Go to Dashboard > Kitchen
        2. Click "Add station"
        3. Fill in the form and submit
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Bun version, browser, database provider, etc.
      placeholder: |
        - OS: Ubuntu 24.04 (WSL2)
        - Bun: 1.3.2
        - Browser: Chrome 131
        - DB: PostgreSQL 16 (local)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant terminal output, browser console errors, or screenshots.
    validations:
      required: false

  - type: dropdown
    id: edition
    attributes:
      label: Edition
      description: Which edition are you using?
      options:
        - Community Edition (GitHub / AGPL)
        - Commercial Edition (CodeCanyon)
        - Not sure
    validations:
      required: true
